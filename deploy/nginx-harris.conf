# /etc/nginx/sites-available/harris.football
# OWFC Harris — static site (hash-routed SPA, no rewrites needed)
# After placing this file: see DEPLOY-HETZNER.md for the enable + HTTPS steps.

server {
    listen 80;
    listen [::]:80;
    server_name harris.football www.harris.football;

    root /var/www/harris;
    index index.html;

    # Hash routing means every page is index.html — simple file serving is enough.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets, but never cache the config or HTML (so updates show up).
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /js/config.js { add_header Cache-Control "no-store"; }
    location = /index.html   { add_header Cache-Control "no-store"; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
